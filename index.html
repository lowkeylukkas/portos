<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PortOS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="boot-screen" class="boot-screen" aria-label="PortOS starting">
    <div class="boot-glow"></div>
    <div class="boot-center">
      <div class="portos-orb" aria-hidden="true"><span class="orb-star">✦</span></div>
      <div class="boot-wordmark">PortOS</div>
      <div class="loading-track" aria-hidden="true"><div class="loading-shimmer"></div></div>
      <div class="boot-status">Starting PortOS</div>
    </div>
  </main>

  <main id="desktop" class="desktop" aria-hidden="true">
    <div class="desktop-placeholder">
      <div class="placeholder-orb"><span>✦</span></div>
      <div class="placeholder-title">PortOS</div>
      <div class="placeholder-subtitle">Desktop coming next</div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
