<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#061b3a" />
  <title>PortOS</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="taskbar.css" />
  <link rel="stylesheet" href="desktop-icons.css" />
  <link rel="stylesheet" href="music-player.css" />
  <link rel="stylesheet" href="start-menu.css" />
  <link rel="stylesheet" href="lockscreen.css" />
  <link rel="stylesheet" href="final-polish.css" />
  <link rel="stylesheet" href="wallpaper-fix.css" />
  <link rel="stylesheet" href="logo-fix.css" />
  <link rel="stylesheet" href="polish-overrides.css" />
</head>
<body>
  <main id="boot-screen" class="boot-screen" aria-label="PortOS starting">
    <div class="boot-glow"></div><div class="boot-center"><div class="portos-orb" aria-hidden="true"><img class="portos-logo-image" src="Iridescent Crystal Star Emblem.png" alt="" /></div><div class="boot-wordmark">PortOS</div><div class="loading-track" aria-hidden="true"><div class="loading-shimmer"></div></div><div class="boot-status">Starting PortOS</div></div>
  </main>
  <main id="lock-screen" class="lock-screen" aria-hidden="true">
    <div class="lock-wallpaper" aria-hidden="true"></div><div class="lock-vignette" aria-hidden="true"></div>
    <div class="lock-content"><div class="lock-clock-wrap"><div id="lock-time" class="lock-time">10:30</div><div id="lock-date" class="lock-date">Friday, October 30</div></div><div class="user-card"><div class="user-avatar" aria-hidden="true"><div class="avatar-glass"></div><img class="portos-logo-image portos-lock-logo" src="Iridescent Crystal Star Emblem.png" alt="" /></div><div class="user-name">User</div><button id="login-button" class="login-button" type="button">Log In</button></div></div>
    <div class="lock-corner lock-bottom-left"><button class="corner-button" type="button" aria-label="Accessibility">◉</button></div><div class="lock-corner lock-bottom-right"><button class="corner-button" type="button" aria-label="Power">⏻</button></div><div class="lock-shine" aria-hidden="true"></div>
  </main>
  <main id="desktop" class="desktop" aria-hidden="true">
    <section class="desktop-icon-field" aria-label="Portfolio applications">
      <button class="desktop-icon icon-mapeh" type="button" aria-label="MAPEH"><span class="icon-orb"><span class="icon-symbol">♫</span></span><span class="icon-label">MAPEH</span></button>
      <button class="desktop-icon icon-tle" type="button" aria-label="TLE"><span class="icon-orb"><span class="icon-symbol">⚙</span></span><span class="icon-label">TLE</span></button>
      <button class="desktop-icon icon-values" type="button" aria-label="Values Education"><span class="icon-orb"><span class="icon-symbol">♥</span></span><span class="icon-label">Values Ed.</span></button>
      <button class="desktop-icon icon-english" type="button" aria-label="English"><span class="icon-orb"><span class="icon-symbol">A</span></span><span class="icon-label">English</span></button>
      <button class="desktop-icon icon-ap" type="button" aria-label="Araling Panlipunan"><span class="icon-orb"><span class="icon-symbol">✈</span></span><span class="icon-label">Araling Panlipunan</span></button>
      <button class="desktop-icon icon-about" type="button" aria-label="About Me"><span class="icon-orb"><span class="icon-symbol">☺</span></span><span class="icon-label">About Me</span></button>
      <button class="desktop-icon icon-music" type="button" aria-label="Music"><span class="icon-orb"><span class="icon-symbol">♫</span></span><span class="icon-label">Music</span></button>
      <button class="desktop-icon icon-science" type="button" aria-label="Science"><span class="icon-orb"><span class="icon-symbol">⚗</span></span><span class="icon-label">Science</span></button>
      <button class="desktop-icon icon-filipino" type="button" aria-label="Filipino"><span class="icon-orb"><span class="icon-symbol">文</span></span><span class="icon-label">Filipino</span></button>
      <button class="desktop-icon icon-math" type="button" aria-label="Mathematics"><span class="icon-orb"><span class="icon-symbol">∑</span></span><span class="icon-label">Mathematics</span></button>
    </section>
    <aside class="music-gadget" aria-label="Music player">
      <div class="music-gadget-shell"><div class="music-bubble one"></div><div class="music-bubble two"></div><div class="music-bubble three"></div><div class="music-header"><span class="music-status-dot"></span><span>PORTOS MUSIC</span><span style="margin-left:auto;opacity:.7">♪ LIVE</span></div><div class="music-main"><div class="album-jewel" aria-hidden="true"><div class="album-orb"></div><div class="album-note">♫</div></div><div class="track-info"><div class="track-title">Ocean Dreams</div><div class="track-artist">PortOS • Frutiger Mix</div><div class="visualizer" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div></div><div class="music-progress-wrap"><div class="music-progress" aria-label="Track progress"><div class="music-progress-fill"></div></div><div class="music-times"><span>0:00</span><span>0:00</span></div></div><div class="music-controls"><button class="music-button" type="button" aria-label="Previous">◀</button><button class="music-button play" type="button" aria-label="Play">▶</button><button class="music-button" type="button" aria-label="Next">▶</button><button class="music-button" type="button" aria-label="Shuffle" aria-pressed="false">⤨</button><button class="music-button" type="button" aria-label="Repeat" aria-pressed="false">↻</button></div><div class="volume-control"><span class="volume-icon">🔊</span><div class="volume-track"><div class="volume-fill"></div></div><span style="font-size:8px;font-weight:800;color:#eaffff;text-shadow:0 1px 2px #005083">72%</span></div></div>
    </aside>
    <aside id="start-menu" class="start-menu" aria-label="Start menu" aria-hidden="true">
      <div class="start-menu-shell"><div class="start-user"><div class="start-avatar"><img class="portos-logo-image portos-start-logo" src="Iridescent Crystal Star Emblem.png" alt="" /></div><div><div class="start-user-name">User</div><div class="start-user-sub">PORTOS PERSONAL DESKTOP</div></div></div><div class="start-columns"><section class="start-column"><div class="start-section-title">Subjects</div><button class="start-item" type="button"><span class="start-item-icon">♫</span><span class="start-item-text"><strong>MAPEH</strong><small>Music, Arts, PE &amp; Health</small></span></button><button class="start-item" type="button"><span class="start-item-icon">⚙</span><span class="start-item-text"><strong>TLE</strong><small>Technology and Livelihood Education</small></span></button><button class="start-item" type="button"><span class="start-item-icon">♥</span><span class="start-item-text"><strong>Values Ed.</strong><small>Values Education</small></span></button><button class="start-item" type="button"><span class="start-item-icon">A</span><span class="start-item-text"><strong>English</strong><small>English subject</small></span></button><button class="start-item" type="button"><span class="start-item-icon">🌏</span><span class="start-item-text"><strong>Araling Panlipunan</strong><small>Social studies</small></span></button><button class="start-item" type="button"><span class="start-item-icon">☺</span><span class="start-item-text"><strong>About Me</strong><small>About the portfolio creator</small></span></button></section><section class="start-column start-right"><div class="start-section-title">More subjects</div><button class="start-item" type="button"><span class="start-item-icon">♫</span><span class="start-item-text"><strong>Music</strong><small>Open PortOS Music</small></span></button><button class="start-item" type="button"><span class="start-item-icon">⚗</span><span class="start-item-text"><strong>Science</strong><small>Science subject</small></span></button><button class="start-item" type="button"><span class="start-item-icon">文</span><span class="start-item-text"><strong>Filipino</strong><small>Filipino subject</small></span></button><button class="start-item" type="button"><span class="start-item-icon">∑</span><span class="start-item-text"><strong>Mathematics</strong><small>Mathematics subject</small></span></button></section></div><div class="start-footer"><button class="start-footer-button" type="button">◉ Search</button><button class="start-footer-button" type="button">⏻ Shut Down</button></div></div>
    </aside>
    <nav class="portos-taskbar" aria-label="PortOS taskbar"><button class="start-orb" id="start-orb" type="button" aria-label="Start" aria-expanded="false"><span><img class="portos-logo-image portos-taskbar-logo" src="Iridescent Crystal Star Emblem.png" alt="" /></span></button><div class="taskbar-apps" aria-label="Open applications"></div><div class="system-tray" aria-hidden="true"></div></nav>
  </main>
  <script src="script.js?v=20261030a"></script><script src="music-library.js?v=20261030a"></script><script src="polish-runtime.js?v=20261030b"></script><script src="qol-fix.js?v=20261031e"></script><script src="bug-fixes.js?v=20261031f"></script><script src="dock-clock.js?v=20261031a"></script><script src="portfolio-outputs.js?v=20261101a"></script><script src="vista-apps.js?v=20261101b"></script><script src="science-output.js?v=20261101b"></script><script src="portfolio-media.js?v=20261101c"></script>
</body>
</html>
