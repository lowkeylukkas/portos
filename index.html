<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#061b3a" />
  <title>PortOS</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="taskbar.css" />
</head>
<body>
  <main id="boot-screen" class="boot-screen" aria-label="PortOS starting">
    <div class="boot-glow"></div>
    <div class="boot-center">
      <div class="portos-orb" aria-hidden="true"><span class="orb-star">✦</span></div>
      <div class="boot-wordmark">PortOS</div>
      <div class="loading-track" aria-hidden="true"><div class="loading-shimmer"></div></div>
      <div class="boot-status">Starting PortOS</div>
    </div>
  </main>

  <main id="lock-screen" class="lock-screen" aria-hidden="true">
    <div class="lock-wallpaper" aria-hidden="true"></div>
    <div class="lock-vignette" aria-hidden="true"></div>
    <div class="lock-content">
      <div class="lock-clock-wrap">
        <div id="lock-time" class="lock-time">10:30</div>
        <div id="lock-date" class="lock-date">Friday, October 30</div>
      </div>
      <div class="user-card">
        <div class="user-avatar" aria-hidden="true"><div class="avatar-glass"></div><span>✦</span></div>
        <div class="user-name">User</div>
        <button id="login-button" class="login-button" type="button">Log In</button>
      </div>
    </div>
    <div class="lock-corner lock-bottom-left"><button class="corner-button" type="button" aria-label="Accessibility">◉</button></div>
    <div class="lock-corner lock-bottom-right"><button class="corner-button" type="button" aria-label="Power">⏻</button></div>
    <div class="lock-shine" aria-hidden="true"></div>
  </main>

  <main id="desktop" class="desktop" aria-hidden="true">
    <section class="desktop-icon-field" aria-label="Portfolio applications">
      <button class="desktop-icon icon-mapeh" type="button" aria-label="MAPEH"><span class="icon-orb"><span class="icon-symbol">♫</span></span><span class="icon-label">MAPEH</span></button>
      <button class="desktop-icon icon-tle" type="button" aria-label="TLE"><span class="icon-orb"><span class="icon-symbol">⚙</span></span><span class="icon-label">TLE</span></button>
      <button class="desktop-icon icon-values" type="button" aria-label="Values Education"><span class="icon-orb"><span class="icon-symbol">♥</span></span><span class="icon-label">Values Ed.</span></button>
      <button class="desktop-icon icon-english" type="button" aria-label="English"><span class="icon-orb"><span class="icon-symbol">A</span></span><span class="icon-label">English</span></button>
      <button class="desktop-icon icon-ap" type="button" aria-label="Araling Panlipunan"><span class="icon-orb"><span class="icon-symbol">✈</span></span><span class="icon-label">Araling Panlipunan</span></button>
      <button class="desktop-icon icon-gallery" type="button" aria-label="My Galleries"><span class="icon-orb"><span class="icon-symbol">✿</span></span><span class="icon-label">My Galleries</span></button>
      <button class="desktop-icon icon-integration" type="button" aria-label="Integration"><span class="icon-orb"><span class="icon-symbol">✦</span></span><span class="icon-label">Integration</span></button>
      <button class="desktop-icon icon-reflection" type="button" aria-label="Reflection"><span class="icon-orb"><span class="icon-symbol">◒</span></span><span class="icon-label">Reflection</span></button>
      <button class="desktop-icon icon-sources" type="button" aria-label="Credits and Sources"><span class="icon-orb"><span class="icon-symbol">◎</span></span><span class="icon-label">Credits &amp; Sources</span></button>
      <button class="desktop-icon icon-music" type="button" aria-label="Music"><span class="icon-orb"><span class="icon-symbol">♫</span></span><span class="icon-label">Music</span></button>
      <button class="desktop-icon icon-about" type="button" aria-label="About Me"><span class="icon-orb"><span class="icon-symbol">☻</span></span><span class="icon-label">About Me</span></button>
      <button class="desktop-icon icon-science" type="button" aria-label="Science"><span class="icon-orb"><span class="icon-symbol">⚗</span></span><span class="icon-label">Science</span></button>
      <button class="desktop-icon icon-filipino" type="button" aria-label="Filipino"><span class="icon-orb"><span class="icon-symbol">文</span></span><span class="icon-label">Filipino</span></button>
      <button class="desktop-icon icon-math" type="button" aria-label="Mathematics"><span class="icon-orb"><span class="icon-symbol">∑</span></span><span class="icon-label">Mathematics</span></button>
    </section>

    <div class="desktop-clock" aria-label="Analog clock">
      <div class="clock-glass"><div class="clock-face"><div class="clock-reflection"></div><div class="clock-ticks" aria-hidden="true"></div><div class="clock-hand clock-hour"></div><div class="clock-hand clock-minute"></div><div class="clock-hand clock-second"></div><div class="clock-center"></div><div class="clock-water-glint"></div></div></div>
    </div>

    <div class="desktop-placeholder"></div>

    <nav class="portos-taskbar" aria-label="PortOS taskbar">
      <button class="start-orb" id="start-orb" type="button" aria-label="Start"><span>✦</span></button>
      <div class="taskbar-apps" aria-label="Open applications">
        <button class="task-app active" type="button" aria-label="Desktop"><span class="mini-icon">⌂</span></button>
        <button class="task-app" type="button" aria-label="Files"><span class="mini-icon">▰</span></button>
        <button class="task-app" type="button" aria-label="Gallery"><span class="mini-icon">✿</span></button>
      </div>
      <div class="system-tray">
        <span class="tray-symbol" aria-label="Network">◉</span><span class="tray-symbol" aria-label="Volume">◖</span><span class="tray-symbol" aria-label="Battery">▣</span>
        <div id="taskbar-clock" class="taskbar-clock">10:30<small>Friday</small></div>
      </div>
    </nav>
  </main>
  <script src="script.js"></script>
</body>
</html>
